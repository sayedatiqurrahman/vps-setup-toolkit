# VPS Setup Toolkit - Unified Service Access catalog.
#
# Format (pipe-separated, no spaces around separators):
#   ID|CATEGORY|NAME|TCP PORTS|UDP PORTS|NOTE|IPV6|PROBE HOST|PROBE MODE
#
# Port lists are space-separated. Empty fields mean "no ports of that type".
# IPV6=1 means the service is meaningful over IPv6; IPV6=0 limits generated
# bridge rules to IPv4. PROBE HOST/MODE are optional and are used only by the
# connectivity test. They never create listeners or publish inbound ports.
#
# Every entry describes OUTBOUND egress from the VPS host and Docker bridges.
# Overlapping ports (for example SSH and SFTP) are intentionally allowed; the
# effective rule builder de-duplicates them before anything is applied.
# IDs 1-20 preserve the original documented categories where possible.

