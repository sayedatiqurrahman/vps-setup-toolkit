# VPS Setup Toolkit - outbound service catalog.
#
# Format (pipe-separated, no spaces around separators):
#   ID|DISPLAY NAME|TCP PORTS|UDP PORTS|NOTE
#
# Port lists are space-separated. Empty field means "no ports of that type".
# These categories control OUTBOUND egress only. Nothing here opens a public
# inbound port. Database, Redis, S3 and mail destinations are never published
# as inbound services by the toolkit; see docs/FIREWALL.md.
#
# IDs 1-20 and their ports mirror the original
# complete-vps-setup-security-guide.md specification.

1|Web/API|80 443||HTTP/HTTPS APIs
2|DNS|53|53|Resolver traffic
3|NTP||123|Time synchronization
4|SSH/Git|22||Remote git over SSH
5|SMTP|25 465 587||Mail submission/relay (587 recommended)
6|IMAP|143 993||Mail retrieval (993 recommended)
7|POP3|110 995||Mail retrieval (995 recommended)
8|MySQL/MariaDB|3306||Remote database destination
9|PostgreSQL|5432||Remote database destination
10|Microsoft SQL Server|1433||Remote database destination
11|Oracle|1521||Remote database destination
12|Redis|6379||Remote cache destination
13|MongoDB|27017||Remote database destination
14|S3/MinIO common|9000||Object storage destination
15|Elasticsearch|9200 9300||Search cluster destination
16|RabbitMQ|5671 5672||AMQP destination
17|MQTT|1883 8883||MQTT broker destination
18|External MariaDB|23306||External database destination on custom port
19|Garage/S3 endpoint|24900||Object storage destination on custom port
20|SMS/REST API|443||HTTPS API gateway (usually covered by Web/API)
